name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mcp-tool-gateway .
      - name: smoke test
        run: |
          docker run -d --name gw -p 8600:8600 mcp-tool-gateway
          for i in $(seq 1 20); do curl -fs localhost:8600/api/health && exit 0; sleep 1; done
          docker logs gw; exit 1
